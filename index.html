<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Inhee's Gym</title>
<meta name="description" content="주 5회 하체·둔근 집중 루틴과 운동 기록">
<meta name="theme-color" content="#F3F1F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121018" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Inhee's Gym">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F3F1F6; --surface:#FFFFFF; --surface-2:#F8F6FB; --ink:#1E1A2B; --muted:#625C74; --line:#E3DFEA;
  --accent:#5B3E9E; --accent-ink:#FFFFFF; --accent-soft:#ECE6F7;
  --mon:#7A3B8C; --tue:#2F68A8; --wed:#1C7C6E; --fri:#B86E10; --sat:#C8463A; --rest:#9A94A8; --plate-ink:#FFFFFF;
  --glute:var(--mon); --quad:var(--tue); --back:var(--wed); --core:var(--fri); --cardio:var(--sat); --recover:#5F7F6E;
  --glute-soft:#F2E7F5; --quad-soft:#E5EEF8; --back-soft:#E0F1EE; --core-soft:#F8EDDD; --cardio-soft:#F9E6E3; --recover-soft:#E6EFEA;
  --danger:#B3372F;
  --shadow:0 1px 2px rgba(40,30,70,.05),0 6px 18px rgba(40,30,70,.07);
  --f-body:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-disp:"Do Hyeon","IBM Plex Sans KR","Apple SD Gothic Neo",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --tab-h:64px;
  --mus-p:#FFC400; --mus-s:#FFEDA0; --mus-ink:#1b1f24;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121018; --surface:#1B1823; --surface-2:#221E2C; --ink:#ECE8F3; --muted:#A39CB4; --line:#2E2939;
    --accent:#B4A2F0; --accent-ink:#1A1230; --accent-soft:#2A2240;
    --mon:#C28AD4; --tue:#7FAEE6; --wed:#5FC2B2; --fri:#E2A04A; --sat:#EC8A7C; --rest:#6E6880; --plate-ink:#15121C;
    --recover:#8DB59F;
    --glute-soft:#2E2236; --quad-soft:#1D2838; --back-soft:#17302C; --core-soft:#33281A; --cardio-soft:#3A2220; --recover-soft:#1E2B24;
    --danger:#EF7D74; --shadow:0 1px 2px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121018; --surface:#1B1823; --surface-2:#221E2C; --ink:#ECE8F3; --muted:#A39CB4; --line:#2E2939;
  --accent:#B4A2F0; --accent-ink:#1A1230; --accent-soft:#2A2240;
  --mon:#C28AD4; --tue:#7FAEE6; --wed:#5FC2B2; --fri:#E2A04A; --sat:#EC8A7C; --rest:#6E6880; --plate-ink:#15121C;
  --recover:#8DB59F;
  --glute-soft:#2E2236; --quad-soft:#1D2838; --back-soft:#17302C; --core-soft:#33281A; --cardio-soft:#3A2220; --recover-soft:#1E2B24;
  --danger:#EF7D74; --shadow:0 1px 2px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
img{max-width:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation;-webkit-user-select:none;user-select:none}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

.wrap{max-width:540px;margin:0 auto;padding-inline:16px;padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(var(--tab-h) + 28px + env(safe-area-inset-bottom,0px))}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 14px}
.brand{font-family:var(--f-disp);font-size:27px;letter-spacing:.3px;color:var(--accent);line-height:1}
.date{color:var(--muted);font-size:13px;margin-top:3px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:5px 11px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.pill svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8}

h2.sec{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--muted);margin:26px 0 10px}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.hero{padding:18px;box-shadow:var(--shadow)}
.hero-top{display:flex;gap:14px;align-items:flex-start}
.plate{flex:none;width:56px;height:56px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-disp);font-size:30px;color:var(--plate-ink);background:var(--rest)}
.plate.mon{background:var(--mon)} .plate.tue{background:var(--tue)} .plate.wed{background:var(--wed)} .plate.fri{background:var(--fri)} .plate.sat{background:var(--sat)}
.plate.sm{width:36px;height:36px;font-size:19px;border-radius:9px}
.eyebrow{font-size:12px;color:var(--muted);font-weight:500}
.hero h3{margin:2px 0 2px;font-size:20px;line-height:1.3;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);white-space:nowrap}
.chip.glute{background:var(--glute-soft);border-color:transparent;color:var(--glute);font-weight:500}
.chip.quad{background:var(--quad-soft);border-color:transparent;color:var(--quad);font-weight:500}
.chip.back{background:var(--back-soft);border-color:transparent;color:var(--back);font-weight:500}
.chip.core{background:var(--core-soft);border-color:transparent;color:var(--core);font-weight:500}
.chip.cardio{background:var(--cardio-soft);border-color:transparent;color:var(--cardio);font-weight:500}
.chip.recover{background:var(--recover-soft);border-color:transparent;color:var(--recover);font-weight:500}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:46px;padding:0 18px;border-radius:12px;font-weight:700;font-size:15px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface-2);border:1px solid var(--line)}
.btn.danger{background:var(--danger);color:#fff}
.btn.block{width:100%}
.btn.sm{height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.linkish{color:var(--accent);font-weight:500;font-size:13px}
.hero .actions{display:flex;gap:8px;margin-top:16px}
.hero .actions .primary{flex:1}
.cardio-line{display:flex;gap:8px;align-items:baseline;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-size:13px}
.cardio-line b{color:var(--cardio);font-weight:700;flex:none}

.banner{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;background:var(--accent-soft);margin-bottom:12px;font-size:14px}
.banner svg{flex:none;width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:1.8;margin-top:2px}
.banner b{display:block;margin-bottom:2px}
.banner .x{margin-left:auto;flex:none;color:var(--muted);font-size:13px;padding:2px 4px}
.resume{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:500;margin-bottom:12px;width:100%;text-align:left}

.missed{display:flex;flex-direction:column}
.missed button{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.missed button:first-of-type{border-top:0}
.missed .nm{flex:1;min-width:0}
.missed .nm b{display:block;font-weight:500}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.wd{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.wd .dot{width:32px;height:32px;border-radius:9px;border:1.5px dashed var(--line);display:grid;place-items:center;font-family:var(--f-disp);font-size:15px;color:var(--muted)}
.wd .dot.plan{border-color:color-mix(in srgb,var(--muted) 45%,transparent)}
.wd .dot.miss{opacity:.45}
.wd .dot.off{border:0;font-family:var(--f-body);font-size:11px}
.wd .dot.done{border:0;color:var(--plate-ink)}
.wd .dot.mon{background:var(--mon)} .wd .dot.tue{background:var(--tue)} .wd .dot.wed{background:var(--wed)} .wd .dot.fri{background:var(--fri)} .wd .dot.sat{background:var(--sat)}
.wd.today{color:var(--ink);font-weight:700}
.wd.today .dot:not(.done){border-color:var(--ink)}
.weekfoot{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--muted)}
.weekfoot b{color:var(--ink);font-family:var(--f-num);font-weight:500}

.tip{display:flex;gap:12px;font-size:14px}
.tip .tl{flex:none;font-family:var(--f-disp);color:var(--accent);font-size:16px;padding-top:0}
.disclaim{font-size:12px;color:var(--muted);margin-top:22px;line-height:1.6}

/* plan & dictionary */
.plan{display:flex;flex-direction:column}
.plan button,.plan .off{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.plan > :first-child{border-top:0}
.plan .nm{flex:1;min-width:0}
.plan .nm b{display:block;font-weight:500}
.plan .off .nm b{color:var(--muted);font-weight:400}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px}
.filters button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lib{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.lib button{display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left;border-bottom:1px solid var(--line)}
.lib button:last-child{border-bottom:0}
.lib .nm{flex:1;min-width:0}
.lib .nm b{display:block;font-weight:500}
.lib .nm small{color:var(--muted);font-size:12px}
.cdot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--muted)}
.cdot.glute{background:var(--glute)} .cdot.quad{background:var(--quad)} .cdot.back{background:var(--back)} .cdot.core{background:var(--core)} .cdot.cardio{background:var(--cardio)} .cdot.recover{background:var(--recover)}
.thumb{flex:none;width:52px;height:36px;border-radius:6px;object-fit:cover;background:var(--surface-2);display:block}
.nothumb{flex:none;width:52px;height:36px;border-radius:6px;background:var(--surface-2);display:grid;place-items:center}

/* history */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head b{font-size:16px}
.cal-head button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:11px;color:var(--muted);padding-bottom:4px}
.cal .d{aspect-ratio:1;max-width:100%;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-family:var(--f-num);color:var(--muted)}
.cal .d.has{color:var(--plate-ink);font-weight:500}
.cal .d.mon{background:var(--mon)} .cal .d.tue{background:var(--tue)} .cal .d.wed{background:var(--wed)} .cal .d.fri{background:var(--fri)} .cal .d.sat{background:var(--sat)}
.cal .d.today{outline:1.5px solid var(--ink);outline-offset:-1.5px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px}
.hist{display:flex;flex-direction:column;gap:8px}
.hist button{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;text-align:left;width:100%}
.hist .nm{flex:1;min-width:0}
.hist .nm b{display:block;font-weight:500}
.hist .nm small{color:var(--muted);font-size:12px}
.hist .vol{text-align:right;font-size:12px;color:var(--muted)}
.hist .vol b{display:block;font-family:var(--f-num);color:var(--ink);font-size:14px;font-weight:500}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px;background:var(--surface);border:1px dashed var(--line);border-radius:12px}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile small{display:block;color:var(--muted);font-size:12px}
.tile b{font-family:var(--f-num);font-size:22px;font-weight:500}
.tile b span{font-family:var(--f-body);font-size:13px;color:var(--muted);margin-left:3px;font-weight:400}
.chart svg{display:block;width:100%;height:auto}
.chart .ax{fill:var(--muted);font-size:10px;font-family:var(--f-num)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--accent);opacity:.12}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .pt.last{fill:var(--accent)}
.chart .lbl{fill:var(--ink);font-size:11px;font-family:var(--f-num);font-weight:500}
.chart .bar{fill:color-mix(in srgb,var(--cardio) 40%,var(--surface))}
.chart .bar.now{fill:var(--cardio)}
table.recent{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px}
table.recent td{padding:7px 0;border-top:1px solid var(--line)}
table.recent td:last-child{text-align:right;font-family:var(--f-num)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tab-h)}
.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--muted)}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--accent);font-weight:700}

/* session */
.session{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column}
.s-head{flex:none;background:var(--surface);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px}
.s-head .in{max-width:540px;margin:0 auto;display:flex;align-items:center;gap:12px}
.s-head .t{flex:1;min-width:0}
.s-head .t b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-head .t small{color:var(--muted);font-size:12px}
.s-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.s-body .in{max-width:540px;margin:0 auto;padding:14px 16px 170px;display:flex;flex-direction:column;gap:12px}
.grp{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:13px;font-weight:700;color:var(--muted);margin-top:8px}
.grp .req{font-size:11px;font-weight:700;color:var(--sat);background:var(--cardio-soft);padding:2px 8px;border-radius:999px}
.grp .note{font-weight:400;font-size:12px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ex.done{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.ex-h{display:flex;gap:10px;align-items:flex-start;padding:14px 14px 8px}
.ex-h .cdot{margin-top:8px}
.ex-h .thumb{cursor:pointer}
.ex-h .nm{flex:1;min-width:0}
.ex-h .nm b{display:block;font-size:16px;line-height:1.35}
.ex-h .nm small{color:var(--muted);font-size:12px}
.ex-h .info{flex:none;height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--line);font-size:12px;color:var(--muted)}
.hint{margin:0 14px 8px;font-size:12.5px;padding:7px 10px;border-radius:8px;background:var(--surface-2);color:var(--muted)}
.hint b{color:var(--accent);font-weight:700}
.hint.care{background:var(--core-soft);color:var(--ink)}
.cue{margin:0 14px 8px;font-size:13px;font-weight:700;color:var(--cardio);font-family:var(--f-num)}
.sets{display:flex;flex-direction:column}
.set{display:grid;grid-template-columns:28px 1fr 1fr 48px;gap:8px;align-items:center;padding:6px 14px}
.set .no{font-family:var(--f-num);color:var(--muted);font-size:13px;text-align:center}
.fld{display:flex;align-items:center;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);padding-right:10px;min-width:0}
.fld input{width:100%;min-width:0;height:100%;border:0;background:transparent;padding:0 0 0 12px;font-family:var(--f-num);font-size:17px;outline:none}
.fld span{flex:none;font-size:12px;color:var(--muted)}
.fld:focus-within{border-color:var(--accent)}
.set.full .fld.w{display:none}
.set.full{grid-template-columns:28px 2fr 48px}
.set.full.timed{grid-template-columns:28px minmax(0,1fr) 96px 48px}
.swb{height:44px;border-radius:10px;border:1.5px solid var(--accent);color:var(--accent);font:700 14px var(--f-num);display:flex;align-items:center;justify-content:center;gap:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.swb svg{width:14px;height:14px;fill:currentColor;stroke:none}
.swb.run{background:var(--danger);border-color:var(--danger);color:#fff}
.swb.run.hit{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.set.ok .swb{opacity:.6}
.ck{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line);display:grid;place-items:center}
.ck svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.set.ok .ck{background:var(--accent);border-color:var(--accent)}
.set.ok .ck svg{stroke:var(--accent-ink)}
.set.ok .fld{opacity:.75}
.ex-f{display:flex;gap:6px;padding:8px 14px 12px;flex-wrap:wrap}
.ex-f button{height:32px;padding:0 10px;border-radius:8px;font-size:12px;color:var(--muted);border:1px solid var(--line)}
.ex-f .rm{margin-left:auto;color:var(--danger);border-color:transparent}
.round-h{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 4px}
.round-h b{font-family:var(--f-disp);font-size:18px;font-weight:400;color:var(--sat)}
.move{border-top:1px solid var(--line);padding-top:8px}
.move:first-of-type{border-top:0}
.move-h{display:flex;gap:10px;align-items:center;padding:0 14px}
.move-h .nm{flex:1;min-width:0}
.move-h .nm b{display:block;font-size:15px;font-weight:500}
.move-h .nm small{color:var(--muted);font-size:12px}
.rounds-f{display:flex;gap:8px;justify-content:center}
.rounds-f button{height:38px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:13px}
.s-foot{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.s-foot .in{max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.rest{display:flex;align-items:center;gap:10px}
.rest .clock{font-family:var(--f-num);font-size:26px;min-width:74px}
.rest .rl{font-size:11px;color:var(--muted);display:block;line-height:1}
.rest .bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;flex:1;min-width:40px}
.rest .bar > i{display:block;height:100%;background:var(--accent);transition:width .25s linear}
.rest.fin .clock{color:var(--accent)}
.rest button{height:34px;padding:0 10px;border-radius:8px;border:1px solid var(--line);font-size:12px;font-family:var(--f-num)}
body.typing .s-foot{display:none}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(12,8,22,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:540px;max-height:88%;overflow-y:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:-6px auto 14px}
.sheet h3{margin:0 0 2px;font-size:20px;text-wrap:balance}
.sheet h4{margin:18px 0 6px;font-size:13px;color:var(--muted);letter-spacing:.04em}
.sheet ol,.sheet ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:65ch}
.note{border-radius:10px;padding:10px 12px;font-size:14px;margin-top:10px}
.note b{display:block;font-size:12px;margin-bottom:2px}
.note.focus{background:var(--glute-soft)} .note.focus b{color:var(--glute)}
.note.care{background:var(--core-soft)} .note.care b{color:var(--core)}
.note.info{background:var(--accent-soft)} .note.info b{color:var(--accent)}
.presc{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.presc span{font-family:var(--f-num);font-size:13px;padding:4px 10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line)}
.sheet .actions{display:flex;gap:8px;margin-top:18px}
.sheet .actions .btn{flex:1}
.pick{display:flex;flex-direction:column;gap:2px;margin-top:10px}
.pick button{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line);text-align:left}
.pick button small{margin-left:auto;color:var(--muted);font-size:12px}
.seg{display:flex;gap:6px}
.seg button{flex:1;height:40px;border-radius:10px;border:1px solid var(--line);font-family:var(--f-num)}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.setting small{display:block;color:var(--muted);font-size:12px}
.switch{flex:none;width:50px;height:30px;border-radius:15px;background:var(--line);position:relative}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.switch.on{background:var(--accent)}
.switch.on::after{left:23px}
.detail-list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.detail-list div{font-size:14px}
.detail-list small{color:var(--muted);font-family:var(--f-num)}
.media{margin:14px -16px 0;display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--line)}
.media figure{margin:0;position:relative}
.media img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;background:var(--surface-2)}
.media figcaption{position:absolute;left:8px;top:8px;font:500 11px var(--f-num);background:rgba(20,18,30,.78);color:#fff;padding:2px 8px;border-radius:4px;letter-spacing:.04em}
.anat{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:12px;align-items:center;margin-top:12px}
.anat.nofig{grid-template-columns:1fr}
.anat img{width:100%;border-radius:10px;display:block}
.mus{display:flex;flex-direction:column;gap:8px;font-size:12.5px}
.mus b{display:block;font-size:11px;color:var(--muted);letter-spacing:.04em;margin-bottom:3px}
.mc{display:inline-block;margin:0 4px 4px 0;padding:2px 8px;border-radius:4px;font-weight:500;color:var(--mus-ink)}
.mc.pri{background:var(--mus-p)} .mc.sec{background:var(--mus-s)}
.credit{font-size:11px;color:var(--muted);margin-top:16px}
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + 20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow);text-align:center}
.session:not([hidden]) ~ .toast{bottom:calc(160px + env(safe-area-inset-bottom,0px))}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
/* ============ DATA ============ */
const CAT = {glute:'하체 뒤·둔근', quad:'하체 앞·안쪽', back:'등·상체', core:'코어', cardio:'유산소', recover:'회복'};
// t: w = 무게+횟수, r = 횟수, t = 초, c = 분(유산소)
const EX = {
  hip_thrust:{n:'힙 쓰러스트',m:'힙 쓰러스트 머신 또는 바벨 + 벤치',c:'glute',mu:'대둔근, 햄스트링',t:'w',s:4,r:[10,12],rest:90,inc:5,
    how:['벤치 모서리에 날개뼈 아래를 걸치고 앉아, 바벨(패드를 감아서)이나 머신 패드를 골반 위에 둡니다.','발은 어깨너비로, 맨 위에서 정강이가 바닥과 수직이 되는 위치에 둡니다.','턱을 살짝 당기고 발뒤꿈치로 밀어 엉덩이를 들어 올립니다. 맨 위에서 엉덩이를 2초 쥐어짭니다.','복부에 힘을 준 채 천천히 내립니다.'],
    tip:['허리를 젖혀서 올리지 말고, 골반을 말아 올린다는 느낌으로.','무릎이 안쪽으로 모이지 않게 바깥으로 살짝 밀어 줍니다.'],
    focus:'이 루틴의 메인 엉덩이 운동입니다. 무게보다 맨 위에서 쥐어짜는 2초가 중요해요.',
    care:'허리가 뻐근하면 무게를 줄이고, 턱을 당겨 시선을 무릎 쪽에 두세요.'},
  rdl:{n:'루마니안 데드리프트',m:'바벨 또는 덤벨',c:'glute',mu:'햄스트링, 대둔근, 척추기립근',t:'w',s:4,r:[10,12],rest:90,inc:2.5,
    how:['바벨을 어깨너비로 잡고 서서, 무릎을 살짝만 굽힌 각도로 고정합니다.','엉덩이를 뒤로 밀어내며 바를 허벅지에 붙인 채 내립니다. 등은 곧게 유지합니다.','허벅지 뒤가 당기는 지점(보통 무릎 아래)까지만 내려갑니다.','엉덩이를 앞으로 밀며 일어섭니다.'],
    tip:['허리가 둥글게 말리기 직전이 내려갈 수 있는 한계입니다.','바가 몸에서 멀어지면 허리 부담이 커집니다.'],
    care:'허리에 통증이 있으면 가벼운 덤벨로 가동범위를 줄여서 하세요.'},
  lying_leg_curl:{n:'라잉 레그 컬',m:'라잉 레그 컬 머신',c:'glute',mu:'햄스트링',t:'w',s:3,r:[15,15],rest:60,inc:2.5,
    how:['엎드려 무릎이 패드 끝에 걸리게 눕고, 발목 패드는 아킬레스건 위에 둡니다.','골반을 패드에 붙인 채 뒤꿈치를 엉덩이 쪽으로 당깁니다.','맨 위에서 1초 멈춥니다.','천천히 내리되 다리를 완전히 펴지 않고 다음 반복으로 넘어갑니다.'],
    tip:['엉덩이가 들리면 무게가 무거운 것입니다.']},
  lat_pulldown:{n:'랫 풀다운',m:'랫 풀다운 머신',c:'back',mu:'광배근, 등 중앙',t:'w',s:4,r:[12,12],rest:75,inc:2.5,
    how:['허벅지 패드를 딱 맞게 고정하고, 바를 어깨너비보다 한 뼘씩 넓게 잡습니다.','가슴을 살짝 들고 상체를 10~15도 뒤로 기울입니다.','팔꿈치를 옆구리 쪽으로 끌어내린다는 느낌으로 바를 쇄골 앞까지 당깁니다.','팔이 다 펴질 때까지 천천히 올립니다.'],
    tip:['바를 목 뒤로 당기지 않습니다.','반동을 쓰지 않아도 되는 무게로.']},
  seated_row:{n:'시티드 케이블 로우',m:'케이블 로우 머신 (V바)',c:'back',mu:'광배근, 승모근, 능형근',t:'w',s:3,r:[12,12],rest:75,inc:2.5,
    how:['발판에 발을 딛고 무릎을 살짝 굽혀 앉습니다.','허리를 세우고 V바를 잡습니다.','팔꿈치를 뒤로 보내며 명치 쪽으로 당기고, 어깨뼈를 모은 채 1초 멈춥니다.','팔을 펴며 천천히 돌려보냅니다.'],

  back_ext:{n:'백 익스텐션 (둔근 집중)',m:'로만 체어 (45도)',c:'glute',mu:'대둔근, 햄스트링, 척추기립근',t:'r',s:3,r:[15,15],rest:60,
    how:['골반 바로 아래에 패드가 오게 높이를 맞추고, 발끝을 살짝 바깥으로 돌립니다.','팔을 가슴 앞에 교차하고 등을 살짝 둥글게 만듭니다.','엉덩이를 쥐어짜며 몸이 일직선이 될 때까지 올라옵니다.','천천히 내려갑니다.'],

    tip:['손잡이에 매달리면 운동 효과가 크게 줄어듭니다.','숨이 차지만 대화는 가능한 정도가 적당합니다.']},
  squat:{n:'스미스머신 스쿼트',m:'스미스 머신 (또는 덤벨)',c:'quad',mu:'대퇴사두근, 대둔근',t:'w',s:4,r:[10,12],rest:90,inc:2.5,
    how:['바를 승모근 위(목 아래 두툼한 부분)에 얹고, 발은 바보다 반 발 앞에 어깨너비로 섭니다.','가슴을 펴고 엉덩이를 뒤·아래로 앉듯이 내려갑니다. 허벅지가 바닥과 평행할 때까지.','발 전체로 바닥을 밀어 일어섭니다.','덤벨로 할 때는 양손에 덤벨을 들고 같은 자세로 합니다.'],
    tip:['무릎이 안쪽으로 모이지 않게 발끝 방향과 맞춥니다.','뒤꿈치가 뜨면 발을 조금 더 앞으로 둡니다.'],
    care:'무릎이 시큰하면 깊이를 줄이고, 통증이 계속되면 레그 프레스로 바꾸세요.'},
  leg_press:{n:'레그 프레스 (발 아래쪽)',m:'레그 프레스 머신',c:'quad',mu:'대퇴사두근',t:'w',s:4,r:[12,15],rest:75,inc:5,

    focus:'무릎을 펴는 근육을 강화해 무릎 안정에 도움이 됩니다.'},
  chest_press:{n:'체스트 프레스',m:'체스트 프레스 머신',c:'back',mu:'대흉근, 삼두, 어깨 앞',t:'w',s:3,r:[12,12],rest:60,inc:2.5,
    how:['손잡이가 가슴 중간 높이에 오도록 의자 높이를 맞춥니다.','어깨뼈를 뒤로 모아 등받이에 붙인 상태로 시작합니다.','팔꿈치를 몸통에서 45도 정도로 유지하며 앞으로 밉니다.','3초 동안 버티며 천천히 돌아옵니다.'],

  leg_raise:{n:'캡틴스 체어 레그 레이즈',m:'캡틴스 체어 (팔꿈치 거치대) 또는 철봉',c:'core',mu:'복직근(하복부)',t:'r',s:3,r:[15,15],rest:45,
    how:['캡틴스 체어에 팔꿈치를 걸고 등을 등받이에 붙입니다.','무릎을 굽혀 가슴 쪽으로 끌어올리며 골반을 살짝 말아 올립니다.','반동 없이 천천히 내립니다.'],

    care:'허리가 아프면 데드버그로 바꾸세요.'},
  plank:{n:'엘보우 플랭크',m:'매트',c:'core',mu:'복부 전체',t:'t',s:3,r:[45,45],rest:45,
    how:['팔꿈치를 어깨 바로 아래에 두고 엎드립니다.','머리부터 발끝까지 일직선을 만들고 버팁니다.'],
    tip:['엉덩이가 처지거나 솟지 않게 합니다.','숨을 참지 말고 짧게 계속 쉽니다.']},
  bike:{n:'실내 자전거',m:'실내 자전거',c:'cardio',mu:'허벅지, 엉덩이',t:'c',s:1,r:[20,20],rest:0,set:'중간 저항 · 회전수 일정하게',
    how:['안장 높이는 페달이 가장 아래일 때 무릎이 살짝 굽는 정도로 맞춥니다.','저항을 중간으로 두고 회전수를 일정하게 유지합니다.'],

const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const dayKey = (d=new Date()) => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseDay = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y,m-1,d); };
const WD = ['일','월','화','수','목','금','토'];
const fmtDate = k => { const d = parseDay(k); return (d.getMonth()+1)+'월 '+d.getDate()+'일 ('+WD[d.getDay()]+')'; };
const fmtShort = k => { const d = parseDay(k); return (d.getMonth()+1)+'/'+d.getDate(); };
const kg = v => (Math.round(v*10)/10).toString();
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function unitOf(ex){ return ex.u || (ex.t==='t' ? '초' : ex.t==='c' ? '분' : '회'); }
function range(ex){ return ex.r[0]===ex.r[1] ? ex.r[0] : ex.r[0]+'–'+ex.r[1]; }
function prescTxt(ex, sets){
  if(ex.t==='c') return range(ex)+'분'+(ex.set ? ' · '+ex.set : '');
  return (sets||ex.s)+'세트 × '+(ex.side?'좌우 각 ':'')+range(ex)+unitOf(ex)+(ex.rest ? ' · 휴식 '+ex.rest+'초' : '');
}
function movePresc(ex){ return (ex.side?'좌우 각 ':'')+range(ex)+unitOf(ex); }
function weekStart(d=new Date()){ const x = new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()-(x.getDay()+6)%7); return x; }
function inWeek(s, ws){ const d = parseDay(s.date); const e = new Date(ws); e.setDate(e.getDate()+7); return d >= ws && d < e; }
function cardioMin(s){ return s.items.reduce((a,it)=>{ const ex = EX[it.ex]; return ex && ex.t==='c' && ex.c==='cardio' ? a + it.sets.reduce((b,x)=>b+(x.r||0),0) : a; }, 0); }
function sessionVolume(s){ return s.items.reduce((a,it)=> EX[it.ex] && EX[it.ex].t==='w' ? a + it.sets.reduce((b,x)=>b+(x.w||0)*(x.r||0),0) : a, 0); }
function thumbHTML(id, act){

  return p && p.k ? `<img class="thumb" src="img/${p.k}_1.jpg" alt="" loading="lazy"${act?` data-act="exinfo" data-ex="${id}"`:''}>` : `<span class="nothumb"><span class="cdot ${EX[id].c}"></span></span>`;
}
function lastPerf(exId){
  for(let i=S.sessions.length-1;i>=0;i--){
    const it = S.sessions[i].items.find(x=>x.ex===exId && x.sets.length);
    if(it) return {date:S.sessions[i].date, sets:it.sets};
  }
  return null;
}
function suggestion(exId){
  const ex = EX[exId], lp = lastPerf(exId);
  if(!lp) return {w:null, text: ex.t==='w' ? '첫 기록이에요. 목표 횟수를 여유 있게 할 수 있는 무게로 시작하세요.' : null};
  if(ex.t==='c') return {w:null, text:'지난번 <b>'+Math.max(...lp.sets.map(s=>s.r||0))+'분</b>'};
  if(ex.t!=='w'){
    const best = Math.max(...lp.sets.map(s=>s.r||0)), step = ex.t==='t' ? 5 : 1;
    return {w:null, text:'지난번 최고 <b>'+best+unitOf(ex)+'</b>. 오늘은 '+step+unitOf(ex)+'만 더.'};
  }
  const w = Math.max(...lp.sets.map(s=>s.w||0));
  const reps = lp.sets.map(s=>s.r||0);
  const top = lp.sets.filter(s=>(s.w||0)===w).every(s=>(s.r||0)>=ex.r[1]);
  const past = '지난번 '+(w>0 ? kg(w)+'kg' : '맨몸')+' × '+reps.join('·');
  if(top) return {w:w+ex.inc, text: past+' → <b>'+kg(w+ex.inc)+'kg</b>으로 올려 보세요'};
  return {w:w, text: past+' → 같은 무게로 <b>'+ex.r[1]+unitOf(ex)+'</b> 채우기'};
}

let actx = null;
function unlockAudio(){
  try{
    if(!actx){
      const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
      try{ if(navigator.audioSession) navigator.audioSession.type = 'ambient'; }catch(e){}
      actx = new AC();
    }
    if(actx.state === 'suspended') actx.resume();
  }catch(e){}
}
function alertTone(times){
  try{ if(navigator.vibrate && (!navigator.userActivation || navigator.userActivation.hasBeenActive)) navigator.vibrate([200,100,200]); }catch(e){}
  if(!S.sound || !actx) return;
  try{
    const t0 = actx.currentTime + .02;
    for(let i=0;i<times;i++){
      const o = actx.createOscillator(), g = actx.createGain(), t = t0 + i*.3;
      o.type = 'sine'; o.frequency.value = i===times-1 ? 1047 : 880;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.35, t+.02); g.gain.exponentialRampToValueAtTime(.0001, t+.24);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+.26);
    }
  }catch(e){}
}

function viewHistory(){
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const days = new Date(y,m+1,0).getDate(), lead = (new Date(y,m,1).getDay()+6)%7;
  const tk = dayKey();
  let cells = ['월','화','수','목','금','토','일'].map(w=>`<div class="h">${w}</div>`).join('');
  for(let i=0;i<lead;i++) cells += '<div></div>';
  for(let d=1; d<=days; d++){
    const k = dayKey(new Date(y,m,d));
    const s = S.sessions.filter(x=>x.date===k).pop();
    cells += `<div class="d${s?' has '+s.rid:''}${k===tk?' today':''}">${d}</div>`;
  }
  const monthCount = S.sessions.filter(s=>{ const d = parseDay(s.date); return d.getFullYear()===y && d.getMonth()===m; }).length;
  const list = S.sessions.slice().reverse().slice(0,50).map(s=>{
    const sets = s.items.reduce((a,it)=>a+it.sets.length,0), vol = sessionVolume(s), cm = cardioMin(s);

  }).join('');
  return `${topbar('기록')}

    <div class="cal-head"><button data-act="cal" data-d="-1" aria-label="이전 달">‹</button><b>${y}년 ${m+1}월 <span class="sub">· ${monthCount}회</span></b><button data-act="cal" data-d="1" aria-label="다음 달">›</button></div>
    <div class="cal">${cells}</div>

  ${list ? `<div class="hist">${list}</div>` : `<div class="empty">아직 기록이 없어요.<br>오늘 탭에서 운동을 시작하면 세트마다 무게와 횟수가 저장됩니다.</div>`}`;
}

function viewStats(){

  // 최근 8주 유산소(분)

  for(let i=7;i>=0;i--){ const w = new Date(ws); w.setDate(w.getDate()-7*i); weeks.push({ws:w, min:S.sessions.filter(s=>inWeek(s,w)).reduce((a,s)=>a+cardioMin(s),0)}); }
  const logged = Object.keys(EX).filter(id=>S.sessions.some(s=>s.items.some(it=>it.ex===id && it.sets.length)));

function barChart(weeks){
  const W=320,H=150,L=8,R=8,T=18,B=22;
  const max = Math.max(60, ...weeks.map(w=>w.min));
  const bw = (W-L-R)/weeks.length;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="최근 8주 유산소 시간">${weeks.map((w,i)=>{
    const h = Math.round((H-T-B) * w.min / max), x = L + i*bw + bw*.18, y = H-B-h, cur = i===weeks.length-1;
    return `<rect class="bar${cur?' now':''}" x="${x.toFixed(1)}" y="${y}" width="${(bw*.64).toFixed(1)}" height="${Math.max(h,1)}" rx="3"/>`
      + (w.min?`<text class="lbl" x="${(x+bw*.32).toFixed(1)}" y="${y-5}" text-anchor="middle">${w.min}</text>`:'')
      + `<text class="ax" x="${(x+bw*.32).toFixed(1)}" y="${H-6}" text-anchor="middle">${cur?'이번 주':fmtShort(dayKey(w.ws))}</text>`;
  }).join('')}<line class="grid" x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}"/></svg>`;
}
function lineChart(pts){
  const W=320,H=170,L=34,R=14,T=16,B=26;
  if(!pts.length) return '';
  const vals = pts.map(p=>p.v);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if(lo===hi){ lo = Math.max(0, lo-5); hi = hi+5; }
  const stepRaw = (hi-lo)/3, mag = Math.pow(10,Math.floor(Math.log10(stepRaw)));
  const step = [1,2,2.5,5,10].map(x=>x*mag).find(x=>x>=stepRaw) || stepRaw;
  lo = Math.floor(lo/step)*step; hi = Math.ceil(hi/step)*step;
  const x = i => pts.length===1 ? (L+W-R)/2 : L + i*(W-L-R)/(pts.length-1);
  const y = v => T + (hi-v)*(H-T-B)/(hi-lo);
  let g = '';
  for(let v=lo; v<=hi+1e-9; v+=step) g += `<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-6}" y="${y(v)+3}" text-anchor="end">${kg(v)}</text>`;
  const path = pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ');
  const area = pts.length>1 ? `<path class="ar" d="${path} L${x(pts.length-1).toFixed(1)} ${H-B} L${x(0).toFixed(1)} ${H-B} Z"/>` : '';
  const dots = pts.map((p,i)=>`<circle class="pt${i===pts.length-1?' last':''}" cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="${i===pts.length-1?4.5:3.2}"/>`).join('');
  const last = pts[pts.length-1];
  const xl = `<text class="ax" x="${x(0)}" y="${H-8}" text-anchor="${pts.length===1?'middle':'start'}">${fmtShort(pts[0].date)}</text>` + (pts.length>1?`<text class="ax" x="${x(pts.length-1)}" y="${H-8}" text-anchor="end">${fmtShort(last.date)}</text>`:'');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="기록 그래프">${g}${area}<path class="ln" d="${path}"/>${dots}<text class="lbl" x="${Math.min(x(pts.length-1), W-R-2)}" y="${y(last.v)-9}" text-anchor="end">${kg(last.v)}</text>${xl}</svg>`;
}

/* ============ BACKUP ============ */
function backupPayload(){ const data = Object.assign({}, S); delete data.draft; return JSON.stringify({app:'inhees-gym', v:1, exportedAt:new Date().toISOString(), data}); }
async function saveBackup(){
  const now = new Date();
  const name = `InheesGym-backup-${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}.json`;
  const file = new File([backupPayload()], name, {type:'application/json'});
  try{
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file]}); return; }
  }catch(e){ if(e && e.name==='AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast('백업 파일을 내려받았어요');
}
function mergeData(src){
  if(!src || !Array.isArray(src.sessions)) return -1;
  const have = new Set(S.sessions.map(s=>s.id)); let added = 0;
  src.sessions.forEach(s=>{ if(s && s.id && Array.isArray(s.items) && !have.has(s.id)){ S.sessions.push(s); have.add(s.id); added++; } });
  S.sessions.sort((a,b)=>a.start-b.start);
  if(src.weekGoal) S.weekGoal = src.weekGoal;
  return added;
}
$('#importFile').addEventListener('change', e=>{
  const f = e.target.files && e.target.files[0]; e.target.value = '';
  if(!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    let src = null;
    try{ const j = JSON.parse(rd.result); src = j && j.data ? j.data : j; }catch(err){}
    const n = mergeData(src);
    if(n < 0){ toast("Inhee's Gym 백업 파일이 아니에요"); return; }
    save(); closeSheet(); render();
    toast(n ? '기록 '+n+'개를 불러왔어요' : '새로 불러올 기록이 없어요');
  };
  rd.readAsText(f);
});

  return `<div class="ex${allDone?' done':''}">
    <div class="ex-h">${thumbHTML(it.ex, true)}<div class="nm"><b>${ex.n}</b><small>${ex.m} · ${prescTxt(ex, it.sets.length)}</small></div><button class="info" data-act="exinfo" data-ex="${it.ex}">방법</button></div>
    ${it.hint?`<div class="hint">${it.hint}</div>`:''}${ex.care&&it.grp!=='cardio'?`<div class="hint care">${ex.care}</div>`:''}
    ${running?`<div class="cue" id="cue"></div>`:''}
    <div class="sets">${it.sets.map((s,j)=>setRow(it,i,j,ex.t==='c'?'':j+1)).join('')}</div>
    <div class="ex-f">${ex.t==='c'?'':`<button data-act="addSet" data-i="${i}">+ 세트</button>${it.sets.length>1?`<button data-act="delSet" data-i="${i}">− 세트</button>`:''}`}<button class="rm" data-act="rmEx" data-i="${i}">빼기</button></div></div>`;
}
function circuitHTML(d){
  const main = d.items.map((it,i)=>[it,i]).filter(([it])=>it.grp==='main');
  if(!main.length) return '';
  const rounds = Math.max(...main.map(([it])=>it.sets.length));
  let html = `<div class="grp">서킷 <span class="req">${rounds}라운드</span><span class="note">동작 사이 ${d.circuit.moveRest}초 · 라운드 사이 ${d.circuit.roundRest/60}분</span></div>`;
  for(let r=0;r<rounds;r++){
    const done = main.every(([it])=>it.sets[r] && it.sets[r].done);
    html += `<section class="ex${done?' done':''}"><div class="round-h"><b>라운드 ${r+1}</b>${done?'<span class="sub">완료</span>':''}</div>`;
    main.forEach(([it,i],m)=>{
      if(!it.sets[r]) return;
      const ex = EX[it.ex];
      html += `<div class="move"><div class="move-h">${thumbHTML(it.ex, true)}<div class="nm"><b>${m+1}. ${ex.n}</b><small>${movePresc(ex)}</small></div></div>${S.draft.sw&&S.draft.sw.i===i&&S.draft.sw.j===r?'<div class="cue" id="cue"></div>':''}${setRow(it,i,r,'')}</div>`;
    });
    html += `</section>`;
  }
  html += `<div class="rounds-f">${rounds < 6 ? `<button data-act="addRound">+ 라운드</button>` : ''}${rounds>1?`<button data-act="delRound">− 라운드</button>`:''}</div>`;
  return html;
}
function renderSession(){
  const d = S.draft; if(!d) return;
  const body = $('#session .s-body'), scroll = body ? body.scrollTop : 0;
  const group = (g, title) => { const html = d.items.map((it,i)=>it.grp===g?cardHTML(it,i):'').join(''); return html ? `<div class="grp">${title}</div>${html}` : ''; };
  const doneSets = d.items.reduce((a,it)=>a+it.sets.filter(s=>s.done).length,0);
  const allSets = d.items.reduce((a,it)=>a+it.sets.length,0);
  const r = RT[d.rid];
  $('#session').innerHTML = `
    <header class="s-head"><div class="in"><div class="plate sm ${d.rid}">${r?r.d:'+'}</div><div class="t"><b>${esc(d.name)}</b><small><span class="num" id="elapsed">0:00</span> · 세트 <span class="num">${doneSets}/${allSets}</span></small></div><button class="btn ghost sm" data-act="minimize">나가기</button></div></header>
    <div class="s-body"><div class="in">
      ${d.circuit ? circuitHTML(d) : group('main','근력 운동')}
      ${group('extra','추가 운동')}${group('cardio','유산소')}${group('post','마무리')}
      <button class="btn ghost block" data-act="addEx">+ 운동 추가</button>
      <button class="btn ghost block" data-act="discard" style="color:var(--danger)">이 운동 기록 버리기</button>
    </div></div>
    <footer class="s-foot"><div class="in">
      <div class="rest" id="rest" hidden><span class="clock"><span class="rl" id="rlabel">휴식</span><span id="rclock">0:00</span></span><div class="bar"><i id="rbar" style="width:0"></i></div><button data-act="restAdj" data-d="-15">−15</button><button data-act="restAdj" data-d="15">+15</button><button data-act="restSkip">건너뛰기</button></div>
      <button class="btn primary block" data-act="finish">운동 완료</button>
    </div></footer>`;
  const nb = $('#session .s-body'); if(nb) nb.scrollTop = scroll;
  sessionTick();
}

/* rest timer (draft에 저장되어 앱을 다시 열어도 이어짐) */
function startRest(sec, label){ const d = S.draft; if(!d || !sec) return; d.rest = {end:Date.now()+sec*1000, total:sec*1000, fin:false, label:label||'휴식'}; save(); sessionTick(); }
// 세트를 끝냈을 때 쉴 시간: 서킷은 동작 사이 30초, 라운드가 끝나면 2분
function afterSetDone(i, j){
  const d = S.draft, it = d.items[i], ex = EX[it.ex];
  if(d.circuit && it.grp==='main'){
    const main = d.items.filter(x=>x.grp==='main');
    const rounds = Math.max(...main.map(x=>x.sets.length));
    const roundDone = main.every(x=>!x.sets[j] || x.sets[j].done);
    if(!roundDone) startRest(d.circuit.moveRest, '다음 동작까지');
    else if(j < rounds-1) startRest(d.circuit.roundRest, '라운드 휴식');
    else { d.rest = null; toast('서킷 끝! 폼롤러로 하체를 풀어 주세요'); }
    return;
  }
  startRest(ex.rest);
}

/* stopwatch for timed sets & cardio */
function swStart(i,j){
  const d = S.draft; if(!d) return;
  if(d.sw) swStop(false);
  d.rest = null;
  d.sw = {i, j, start:Date.now(), hits:0, phase:-1};
  d.items[i].sets[j].done = false;
  save(); renderSession();
}
function swStop(andRest=true){
  const d = S.draft; if(!d || !d.sw) return;
  const {i,j,start} = d.sw; d.sw = null;
  const it = d.items[i]; if(!it || !it.sets[j]){ save(); renderSession(); return; }
  const ex = EX[it.ex], sec = Math.max(1, Math.round((Date.now()-start)/1000));
  const s = it.sets[j];
  s.r = ex.t==='c' ? Math.max(1, Math.round(sec/60)) : (ex.side ? Math.max(1, Math.round(sec/2)) : sec);
  s.done = true;
  save(); renderSession();
  if(andRest){ afterSetDone(i, j); toast(ex.t==='c' ? `${ex.n} ${s.r}분 기록` : `${s.r}초${ex.side?'(한쪽)':''} 기록`); }
}
function swTick(){
  const d = S.draft; if(!d || !d.sw) return;
  const it = d.items[d.sw.i]; if(!it) return;
  const ex = EX[it.ex], sec = Math.floor((Date.now()-d.sw.start)/1000);
  const t = $('#swt'); if(t) t.textContent = fmtSec(sec);
  const inp = $('#r-'+d.sw.i+'-'+d.sw.j); if(inp) inp.value = ex.t==='c' ? Math.max(1, Math.round(sec/60)) : (ex.side ? Math.round(sec/2) : sec);
  const goal = ex.t==='c' ? ex.r[0]*60 : ex.r[0];
  const targets = ex.side ? [goal, goal*2] : [goal];
  const cue = $('#cue');
  if(ex.intv){
    const cycle = ex.intv.reduce((a,p)=>a+p[0],0); let pos = sec % cycle, k = 0;
    while(pos >= ex.intv[k][0]){ pos -= ex.intv[k][0]; k++; }
    const idx = Math.floor(sec / cycle)*ex.intv.length + k;
    if(cue) cue.textContent = `${ex.intv[k][1]} · ${fmtSec(ex.intv[k][0]-pos)} 남음`;
    if(d.sw.phase !== idx){ if(d.sw.phase >= 0 && sec < goal) alertTone(1); d.sw.phase = idx; }
  } else if(cue){
    cue.textContent = ex.side ? (sec < goal ? `한쪽 ${fmtSec(goal-sec)} 남음` : sec < goal*2 ? `반대쪽 ${fmtSec(goal*2-sec)} 남음` : '양쪽 완료') : (sec < goal ? `목표까지 ${fmtSec(goal-sec)}` : '목표 달성');
  }
  while(d.sw.hits < targets.length && sec >= targets[d.sw.hits]){
    d.sw.hits++;
    alertTone(d.sw.hits===targets.length ? 3 : 2);
    if(d.sw.hits===targets.length){ const b = $('#sw-btn'); if(b) b.classList.add('hit'); }
  }
}
function sessionTick(){
  const d = S.draft; if(!d) return;
  const el = $('#elapsed'); if(el) el.textContent = fmtSec(Math.floor((Date.now()-d.start)/1000));
  swTick();
  const box = $('#rest'); if(!box) return;
  const rest = d.rest;
  if(!rest){ box.hidden = true; return; }
  box.hidden = false;
  $('#rlabel').textContent = rest.label || '휴식';
  const left = rest.end - Date.now();
  if(left <= 0){
    if(!rest.fin){ rest.fin = true; box.classList.add('fin'); if(left > -5000) alertTone(2); save(); }
    $('#rclock').textContent = '시작!'; $('#rbar').style.width = '100%';
    if(left < -4000){ d.rest = null; box.hidden = true; box.classList.remove('fin'); save(); }
    return;
  }
  box.classList.remove('fin');
  $('#rclock').textContent = fmtSec(Math.ceil(left/1000));
  $('#rbar').style.width = (100 - left/rest.total*100).toFixed(1)+'%';
}
function finishSession(force){
  const d = S.draft; if(!d) return;
  if(d.sw) swStop(false);
  const items = d.items.map(it=>({ex:it.ex, sets:it.sets.filter(s=>s.done).map(s=>{ const o = {r:Number(s.r)||0}; if(EX[it.ex].t==='w') o.w = Number(s.w)||0; return o; })})).filter(it=>it.sets.length);
  if(!items.length && !force){
    openSheet(`<h3>완료한 세트가 없어요</h3><p class="sub">세트 오른쪽 체크 버튼을 누르면 완료로 기록돼요.</p><div class="actions"><button class="btn ghost" data-act="close">계속 운동</button><button class="btn danger" data-act="discardYes">기록 없이 종료</button></div>`);
    return;
  }
  const s = {id:d.id, rid:d.rid, name:d.name, date:d.date, start:d.start, end:Date.now(), items};
  S.sessions.push(s); S.draft = null; save();
  closeSession(); closeSheet();
  const vol = sessionVolume(s), sets = items.reduce((a,it)=>a+it.sets.length,0), cm = cardioMin(s);
  tab = 'home'; render();
  const nextDay = (()=>{ for(let k=1;k<=7;k++){ const dd = new Date(); dd.setDate(dd.getDate()+k); const id = WEEK[dd.getDay()]; if(id) return [dd, id]; } })();
  openSheet(`<h3>수고했어요</h3><p class="sub">${esc(s.name)} · ${Math.max(1,Math.round((s.end-s.start)/60000))}분</p>
    <div class="tiles" style="margin-top:14px"><div class="tile"><small>완료 세트</small><b>${sets}<span>세트</span></b></div><div class="tile"><small>${cm?'유산소':'볼륨'}</small><b>${cm?cm:Math.round(vol).toLocaleString()}<span>${cm?'분':'kg'}</span></b></div></div>
    ${nextDay?`<p style="margin-top:14px">다음 운동은 <b>${WD[nextDay[0].getDay()]}요일 · ${RT[nextDay[1]].n}</b>이에요.</p>`:''}
    <div class="actions"><button class="btn primary" data-act="close">확인</button></div>`);
}

/* ============ EVENTS ============ */
document.addEventListener('input', e=>{
  const t = e.target; if(!t.dataset || t.dataset.i===undefined || !S.draft) return;
  const it = S.draft.items[+t.dataset.i]; if(!it) return;
  const v = t.value.replace(',', '.').trim();
  it.sets[+t.dataset.j][t.dataset.k] = v==='' ? null : (isNaN(Number(v)) ? null : Number(v));
  save();
});
document.addEventListener('focusin', e=>{ if(e.target.matches('.fld input')) document.body.classList.add('typing'); });
document.addEventListener('focusout', e=>{ if(e.target.matches('.fld input')) document.body.classList.remove('typing'); });
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && !$('#session').hidden){ requestWake(); sessionTick(); } });
document.addEventListener('click', e=>{
  unlockAudio();
  const tb = e.target.closest('.tabs button');
  if(tb){ tab = tb.dataset.tab; try{ localStorage.setItem(LS+'.tab', tab); }catch(er){} render(); window.scrollTo(0,0); return; }
  if(e.target.id==='scrim'){ closeSheet(); return; }
  const b = e.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act, d = S.draft;
  switch(a){
    case 'start': startSession(b.dataset.rid); break;
    case 'resume': openSession(); break;
    case 'discardThen': S.draft = null; save(); startSession(b.dataset.rid); break;
    case 'close': closeSheet(); break;
    case 'pickRoutine':
      openSheet(`<h3>요일 루틴 고르기</h3><p class="sub">빠진 요일이 있으면 오늘 대신 해도 돼요.</p><div class="pick">${ORDER.map(id=>`<button data-act="start" data-rid="${id}"><div class="plate sm ${id}">${RT[id].d}</div>${RT[id].n}<small>약 ${RT[id].min}분</small></button>`).join('')}</div><div class="actions"><button class="btn ghost" data-act="close">닫기</button></div>`); break;
    case 'routine': routineSheet(b.dataset.rid); break;
    case 'exinfo': exSheet(b.dataset.ex); break;
    case 'filter': libFilter = b.dataset.f; render(); break;
    case 'cal': calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()+Number(b.dataset.d), 1); render(); break;
    case 'statEx': statEx = b.dataset.ex; render(); break;
    case 'hideInstall': S.hideInstall = true; save(); render(); break;
    case 'settings': settingsSheet(); break;
    case 'sound': S.sound = !S.sound; save(); settingsSheet(); if(S.sound) alertTone(1); break;
    case 'backupSave': saveBackup(); break;
    case 'backupLoad': $('#importFile').click(); break;
    case 'goal':
      openSheet(`<h3>주간 운동 목표</h3><p class="sub">이 계획은 주 5회예요. 바쁜 주에는 목표를 낮춰도 돼요.</p><div class="seg" style="margin-top:14px">${[3,4,5,6].map(n=>`<button data-act="setGoal" data-n="${n}" class="${S.weekGoal===n?'on':''}">주 ${n}회</button>`).join('')}</div><div class="actions"><button class="btn ghost" data-act="close">닫기</button></div>`); break;
    case 'setGoal': S.weekGoal = +b.dataset.n; save(); closeSheet(); render(); break;
    case 'histDetail': {
      const s = S.sessions.find(x=>x.id===b.dataset.id); if(!s) break;
      openSheet(`<div class="row"><div class="plate sm ${s.rid}">${RT[s.rid]?RT[s.rid].d:'+'}</div><div><h3>${esc(s.name)}</h3><div class="sub">${fmtDate(s.date)} · ${Math.max(1,Math.round((s.end-s.start)/60000))}분</div></div></div>
        <div class="detail-list">${s.items.map(it=>{ const ex = EX[it.ex]; if(!ex) return ''; return `<div><b>${ex.n}</b><br><small>${it.sets.map(x=>ex.t==='w'?kg(x.w||0)+'kg×'+x.r:x.r+unitOf(ex)).join('   ')}</small></div>`; }).join('')}</div>
        <div class="actions"><button class="btn ghost" data-act="close">닫기</button><button class="btn ghost" style="color:var(--danger)" data-act="delAsk" data-id="${s.id}">삭제</button></div>`); break; }
    case 'delAsk':
      openSheet(`<h3>이 기록을 삭제할까요?</h3><p class="sub">삭제하면 되돌릴 수 없어요.</p><div class="actions"><button class="btn ghost" data-act="close">취소</button><button class="btn danger" data-act="delYes" data-id="${b.dataset.id}">삭제</button></div>`); break;
    case 'delYes': S.sessions = S.sessions.filter(x=>x.id!==b.dataset.id); save(); closeSheet(); render(); toast('기록을 삭제했어요'); break;

    // in-session
    case 'minimize': closeSession(); render(); break;
    case 'ck': { if(!d) break; const i = +b.dataset.i, j = +b.dataset.j;
      if(swRunning(i,j)){ swStop(true); break; }
      const it = d.items[i], s = it.sets[j], ex = EX[it.ex];
      s.done = !s.done;
      if(s.done){ if(s.r==null) s.r = ex.r[1]; if(ex.t==='w' && s.w==null) s.w = 0; save(); renderSession(); afterSetDone(i, j); }
      else { save(); renderSession(); }
      break; }
    case 'addSet': { const it = d.items[+b.dataset.i], last = it.sets[it.sets.length-1]; it.sets.push({w:last?last.w:null, r:null, done:false}); save(); renderSession(); break; }
    case 'delSet': { const i = +b.dataset.i, it = d.items[i]; if(it.sets.length>1){ if(d.sw && d.sw.i===i && d.sw.j>=it.sets.length-1) d.sw = null; it.sets.pop(); } save(); renderSession(); break; }
    case 'addRound': d.items.forEach(it=>{ if(it.grp==='main'){ const last = it.sets[it.sets.length-1]; it.sets.push({w:last?last.w:null, r:null, done:false}); } }); save(); renderSession(); break;
    case 'delRound': d.items.forEach((it,i)=>{ if(it.grp==='main' && it.sets.length>1){ if(d.sw && d.sw.i===i && d.sw.j>=it.sets.length-1) d.sw = null; it.sets.pop(); } }); save(); renderSession(); break;
    case 'rmEx': d.sw = null; d.items.splice(+b.dataset.i,1); save(); renderSession(); break;
    case 'swStart': swStart(+b.dataset.i, +b.dataset.j); break;
    case 'swStop': swStop(true); break;
    case 'addEx': {
      const have = new Set(d.items.map(it=>it.ex));
      const groups = Object.keys(CAT).map(c=>`<h4>${CAT[c]}</h4><div class="pick">${Object.entries(EX).filter(([id,e])=>e.c===c && !have.has(id)).map(([id,e])=>`<button data-act="addExYes" data-ex="${id}"><span class="cdot ${c}"></span>${e.n}<small>${e.m}</small></button>`).join('')||'<span class="sub">모두 추가됨</span>'}</div>`).join('');
      openSheet(`<h3>운동 추가</h3>${groups}<div class="actions"><button class="btn ghost" data-act="close">닫기</button></div>`); break; }
    case 'addExYes': { const ex = EX[b.dataset.ex]; d.items.push(newItem(b.dataset.ex, ex.t==='c' ? (ex.c==='cardio'?'cardio':'post') : 'extra')); save(); closeSheet(); renderSession(); break; }
    case 'restAdj': if(d && d.rest){ const dlt = Number(b.dataset.d)*1000; d.rest.end += dlt; d.rest.total = Math.max(d.rest.total + dlt, 1000); d.rest.fin = false; save(); sessionTick(); } break;
    case 'restSkip': if(d){ d.rest = null; save(); sessionTick(); } break;
    case 'finish': finishSession(false); break;
    case 'discard':
      openSheet(`<h3>이 운동 기록을 버릴까요?</h3><p class="sub">입력한 세트가 모두 사라져요.</p><div class="actions"><button class="btn ghost" data-act="close">취소</button><button class="btn danger" data-act="discardYes">버리기</button></div>`); break;
    case 'discardYes': S.draft = null; save(); closeSheet(); closeSession(); render(); toast('운동 기록을 버렸어요'); break;
  }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !$('#scrim').hidden) closeSheet(); });

render();

if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
